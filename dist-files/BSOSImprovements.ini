; ============================================================================
;  BodySlide and OutfitStudio Improvements
;  Todos os valores abaixo sao os padroes. Apagar este arquivo equivale a
;  deixar tudo como esta aqui.
; ============================================================================

[Features]
; 1 = ligado, 0 = desligado.

; BodySlide: caixa de busca com filtro ao vivo no dialogo "Choose Groups".
GroupSearch=1

; Outfit Studio: ao carregar uma roupa, selecionar o shape reference (o verde,
; em negrito) em vez do primeiro mesh da lista.
ReferenceAutoSelect=1

; Outfit Studio: atalhos para Export / Import Slider Data (OBJ). So funcionam
; com algum slider em Edit mode, que e a mesma condicao do proprio programa.
SliderOBJHotkeys=1

; Outfit Studio: atalho para selecionar o shape reference.
ReferenceHotkey=1

; Outfit Studio: redimensionar o brush estilo Blender -- aperta a tecla, move o
; mouse, clica para confirmar. Esc ou botao direito cancela.
BrushResizeDrag=1


[Hotkeys]
; Formato: uma letra ou digito, opcionalmente com Shift+, Ctrl+ e Alt+.
; Exemplos validos: B / Shift+E / Ctrl+Alt+K
; Deixar vazio desliga aquele atalho.
;
; Se voce escolher uma tecla que o Outfit Studio ja usa, use a secao [Remap]
; abaixo para mover o comando original para outro lugar.

; Seleciona o shape reference.
; O padrao e B, e nao R, porque R ja e "Recalculate Normals" no Outfit Studio.
; B esta livre e lembra "base shape", que e como o proprio programa chama o
; reference internamente.
SelectReference=B

; Export / Import Slider Data (OBJ). Ambos livres no Outfit Studio.
ExportSliderOBJ=Shift+E
ImportSliderOBJ=Shift+I

; Entra no modo de redimensionar brush.
; F e "Transform" no Outfit Studio, por isso o [Remap] abaixo move Transform
; para K. Se voce trocar esta tecla, ajuste ou remova aquela linha.
BrushResize=F


[Remap]
; Liga qualquer comando do Outfit Studio a qualquer tecla.
;
; Do lado esquerdo vai o nome interno do comando, que voce encontra em
;   CalienteTools\BodySlide\res\xrc\OutfitStudio.xrc
; procurando pelo texto do menu e olhando o name= do <object> em volta.
; Do lado direito vai a tecla, no mesmo formato da secao [Hotkeys].
;
; Nome que nao existir e ignorado, e os outros atalhos continuam funcionando.

; Transform sai do F, que virou o redimensionar brush.
btnTransform=K

; Exemplos, deixados comentados:
;btnRecalcNormals=N        ; libera o R
;btnRotationCenter=Shift+D ; libera o Shift+R
;btnPivot=Shift+P


[Tuning]
; Passos de brush por pixel de movimento horizontal no modo de redimensionar.
; O brush inteiro tem 300 passos, entao 1.0 significa atravessar o range
; completo em cerca de 300 pixels. Aumente para ficar mais sensivel.
BrushResizeSensitivity=1.0


[Debug]
; 1 grava um log em %TEMP%\BSOSImprovements_BodySlide.log e
; %TEMP%\BSOSImprovements_OutfitStudio.log. Serve para reportar problema.
LogFile=0

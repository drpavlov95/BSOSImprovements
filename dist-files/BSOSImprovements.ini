; ============================================================================
;  BodySlide and OutfitStudio Improvements
;  Every value below is the default. Deleting this file is the same as leaving
;  it exactly as it is here.
; ============================================================================

[Features]
; 1 = on, 0 = off.

; BodySlide: search box with live filtering in the "Choose Groups" dialog.
GroupSearch=1

; BodySlide: search box in the "Batch Build" dialog. Typing scrolls to the
; matching outfits; Enter goes to the next one; "Toggle matching" flips the
; check mark on every outfit that matches.
;
; This one does not filter the list, it only searches it. Batch Build reads its
; result from inside wxWidgets, so the list has to stay exactly as the program
; built it.
BatchBuildSearch=1

; Outfit Studio: when a project loads, select the reference shape (the green,
; bold one) instead of the first mesh in the list.
ReferenceAutoSelect=1

; Outfit Studio: shortcuts for Export / Import Slider Data (OBJ). They only
; work while a slider is in Edit mode, which is the same condition the program
; itself uses for those menu entries.
SliderOBJHotkeys=1

; Outfit Studio: shortcut that selects the reference shape.
ReferenceHotkey=1

; Outfit Studio: Blender-style brush resize -- press the key, move the mouse,
; click to confirm. Esc or right click cancels.
BrushResizeDrag=1

; Outfit Studio: show the keyboard shortcut in the toolbar tooltips, in
; parentheses -- "Shows a transform tool. (K)".
;
; The shortcut is read from the menu entry of the same command, so it follows
; translations and stays right when [Remap] moves a key. Tools whose key lives
; only inside the program's own code -- the digits that switch brushes -- show
; nothing unless you list them under [TooltipShortcuts] below.
ShortcutTooltips=1

; Outfit Studio: search box in the "Symmetrize Vertices..." and "Mask Symmetric
; Vertices..." dialog, which lists one row per slider and one per bone.
;
; The filter only hides rows. A row hidden by the filter keeps its check mark,
; exactly like the Choose Groups search.
SymmetrizeSearch=1

; Outfit Studio: mirror the pose to the bone on the other side. Move the right
; thigh and the left one follows, with the sign flipped on the axes that mirror.
;
; It runs when a drag ends, not while it is happening: mirroring writes through
; the bone list, and doing that on every mouse move would make the sliders jump
; under the cursor. Bones without a side -- Root, Pelvis, NPC Spine -- are left
; alone. Which axes flip is set in [MirrorPose] below.
MirrorBonePose=1

; Both programs: a key that sets every slider in the panel back to zero.
ZeroSlidersHotkey=1

; Outfit Studio: Blender-style camera. The MIDDLE mouse button orbits, and
; Shift+middle pans. The right button keeps orbiting as it always did.
;
; This is the only feature that starts OFF, because it does not add anything --
; it swaps navigation you already have in your hands. Turn it on here and a
; "Blender camera" entry appears at the end of the View menu, so you can flip it
; back and forth without restarting.
BlenderCamera=0


[Hotkeys]
; Format: a single letter or digit, optionally prefixed with Shift+, Ctrl+
; and Alt+. Valid examples: B / Shift+E / Ctrl+Alt+K
; Leave a value empty to disable that shortcut.
;
; If you pick a key Outfit Studio already uses, move the original command out
; of the way with the [Remap] section below.

; Selects the reference shape.
; The default is B rather than R because R is already "Recalculate Normals" in
; Outfit Studio. B is free and hints at "base shape", which is what the program
; calls the reference internally.
SelectReference=B

; Export / Import Slider Data (OBJ). Both free in Outfit Studio.
ExportSliderOBJ=Shift+E
ImportSliderOBJ=Shift+I

; Enters brush resize mode.
; F is "Transform" in Outfit Studio, which is why the [Remap] below moves
; Transform to K. If you change this key, adjust or remove that line.
BrushResize=F

; Sets every slider in the panel back to zero. Works in both programs: in
; BodySlide it is the body sliders, in Outfit Studio the project's sliders.
;
; Z is free in both -- Outfit Studio only uses Ctrl+Z, and BodySlide has no
; shortcuts at all. There is no undo for this in BodySlide, so if you keep
; hitting it by accident, Alt+Z is a good second choice.
ZeroSliders=Z


[Remap]
; Binds any Outfit Studio command to any key.
;
; On the left goes the command's internal name, which you can find in
;   CalienteTools\BodySlide\res\xrc\OutfitStudio.xrc
; by searching for the menu text and reading the name= of the surrounding
; <object>. On the right goes the key, in the same format as [Hotkeys].
;
; A name that does not exist is ignored, and the other shortcuts keep working.

; Transform moves off F, which became the brush resize.
btnTransform=K

; Examples, left commented out:
;btnRecalcNormals=N        ; frees up R
;btnRotationCenter=Shift+D ; frees up Shift+R
;btnPivot=Shift+P


[TooltipShortcuts]
; Only labels a tooltip -- it does NOT bind anything.
;
; It exists for the keys Outfit Studio handles inside its own code, which are
; therefore written nowhere this mod can read: the digits that switch brushes
; are the usual case. Same left-hand side as [Remap], same key format.
;
; If instead you want the mod to actually bind the key, use [Remap] -- the
; tooltip follows from there on its own.

;btnSelect=1
;btnMaskBrush=2
;btnInflateBrush=3
;btnDeflateBrush=4
;btnMoveBrush=5
;btnSmoothBrush=6


[MirrorPose]
; Which axes flip sign when the pose is mirrored to the bone on the other side.
; 1 = negate, 0 = copy as is.
;
; There is no single right answer: it depends on how the skeleton orients each
; bone's local axes, and a custom skeleton can disagree with the vanilla one.
; The defaults below are the Skyrim convention, where X is the axis that runs
; across the body.
;
; If a mirrored pose comes out bending the wrong way, flip one line at a time
; and reload -- the log prints the values it wrote, which makes it quick.
NegateRotationX=0
NegateRotationY=1
NegateRotationZ=1
NegateOffsetX=1
NegateOffsetY=0
NegateOffsetZ=0
NegateScale=0


[Tuning]
; Brush steps per pixel of horizontal movement in resize mode. The whole brush
; range is 300 steps, so 1.0 means crossing the full range in about 300 pixels.
; Raise it to make the drag more sensitive.
BrushResizeSensitivity=1.0


[Debug]
; 1 writes a log to %TEMP%\BSOSImprovements_BodySlide.log and
; %TEMP%\BSOSImprovements_OutfitStudio.log. Useful when reporting a problem.
LogFile=0

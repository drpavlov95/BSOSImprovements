; ============================================================================
;  BodySlide and OutfitStudio Improvements
;  Every value below is the default. Deleting this file is the same as leaving
;  it exactly as it is here.
; ============================================================================

[Features]
; 1 = on, 0 = off.

; BodySlide: search box with live filtering in the "Choose Groups" dialog.
GroupSearch=1

; Outfit Studio: when a project loads, select the reference shape (the green,
; bold one) instead of the first mesh in the list.
ReferenceAutoSelect=1

; Outfit Studio: shortcuts for Export / Import Slider Data (OBJ). They only
; work while a slider is in Edit mode, which is the same condition the program
; itself uses for those menu entries.
SliderOBJHotkeys=1

; Outfit Studio: shortcut that selects the reference shape.
ReferenceHotkey=1

; Outfit Studio: Blender-style brush resize -- press the key, move the mouse,
; click to confirm. Esc or right click cancels.
BrushResizeDrag=1


[Hotkeys]
; Format: a single letter or digit, optionally prefixed with Shift+, Ctrl+
; and Alt+. Valid examples: B / Shift+E / Ctrl+Alt+K
; Leave a value empty to disable that shortcut.
;
; If you pick a key Outfit Studio already uses, move the original command out
; of the way with the [Remap] section below.

; Selects the reference shape.
; The default is B rather than R because R is already "Recalculate Normals" in
; Outfit Studio. B is free and hints at "base shape", which is what the program
; calls the reference internally.
SelectReference=B

; Export / Import Slider Data (OBJ). Both free in Outfit Studio.
ExportSliderOBJ=Shift+E
ImportSliderOBJ=Shift+I

; Enters brush resize mode.
; F is "Transform" in Outfit Studio, which is why the [Remap] below moves
; Transform to K. If you change this key, adjust or remove that line.
BrushResize=F


[Remap]
; Binds any Outfit Studio command to any key.
;
; On the left goes the command's internal name, which you can find in
;   CalienteTools\BodySlide\res\xrc\OutfitStudio.xrc
; by searching for the menu text and reading the name= of the surrounding
; <object>. On the right goes the key, in the same format as [Hotkeys].
;
; A name that does not exist is ignored, and the other shortcuts keep working.

; Transform moves off F, which became the brush resize.
btnTransform=K

; Examples, left commented out:
;btnRecalcNormals=N        ; frees up R
;btnRotationCenter=Shift+D ; frees up Shift+R
;btnPivot=Shift+P


[Tuning]
; Brush steps per pixel of horizontal movement in resize mode. The whole brush
; range is 300 steps, so 1.0 means crossing the full range in about 300 pixels.
; Raise it to make the drag more sensitive.
BrushResizeSensitivity=1.0


[Debug]
; 1 writes a log to %TEMP%\BSOSImprovements_BodySlide.log and
; %TEMP%\BSOSImprovements_OutfitStudio.log. Useful when reporting a problem.
LogFile=0
